name: CI - Real-Time Market Terminal

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit Tests
        run: |
          cd backend
          python -m pytest tests -v

  frontend-check:
    name: Frontend TypeScript, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Strict Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Linter
        run: |
          cd frontend
          npm run lint

      - name: Build Production Next.js Bundle
        run: |
          cd frontend
          npm run build

  docker-smoke-test:
    name: Docker Build & Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-check]
    steps:
      - uses: actions/checkout@v4

      - name: Build and Start Compose Stack (CI Test Mode)
        env:
          TEST_MODE: "true"
          ENVIRONMENT: "development"
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for Backend /ready Check
        run: |
          echo "Polling http://localhost:8000/ready..."
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/ready || true)
            if [ "$STATUS" = "200" ]; then
              echo "Backend is ready! Status: $STATUS"
              curl -s http://localhost:8000/ready
              exit 0
            fi
            echo "Attempt $i: status $STATUS, waiting 2s..."
            sleep 2
          done
          echo "ERROR: Backend did not become ready within 60s"
          docker compose logs backend
          exit 1

      - name: Smoke Test Frontend HTTP
        run: |
          curl -f http://localhost:3000/ || exit 1

      - name: Teardown Compose Stack
        if: always()
        run: docker compose down -v
